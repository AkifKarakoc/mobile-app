name: mobile
description: "Smart Tourism Guide - Izmir akilli turizm rehberi"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management (ADR-002)
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing (ADR-005)
  go_router: ^14.6.2

  # Network (ADR-003)
  dio: ^5.7.0
  retrofit: ^4.4.1
  pretty_dio_logger: ^1.4.0

  # Serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Localization (TR/EN/DE)
  easy_localization: ^3.0.7

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Env & config
  flutter_dotenv: ^5.2.1

  # Logging
  logger: ^2.5.0

  # Media (Sprint 1+: profil foto + Sprint 5 quest verify)
  image_picker: ^1.1.2
  image_cropper: ^8.0.2

  # Maps & location (ADR-009)
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

  # Firebase & Notifications (Sprint 7)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3

  # Google Sign-In (Sprint 8)
  google_sign_in: ^6.2.1

  # UI Components (Sprint 8.6: screen redesign)
  carousel_slider: ^5.0.0
  flutter_rating_bar: ^4.0.1
  photo_view: ^0.15.0
  timelines: ^0.1.0
  percent_indicator: ^4.2.3
  cached_network_image: ^3.4.1
  share_plus: ^10.1.4
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.15.0
  freezed: ^3.2.3
  json_serializable: ^6.9.0
  retrofit_generator: ^10.2.1

  # Testing
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
